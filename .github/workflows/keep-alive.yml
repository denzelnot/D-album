name: Keep Supabase Alive

on:
  schedule:
    # Запуск каждые 3 дня в 00:00
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET 'https://nynaypkgnnccjroypvyu.supabase.co/rest/v1/' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
