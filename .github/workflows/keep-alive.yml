name: Keep Supabase Alive

on:
  schedule:
    # Запуск каждые 2 дня в 00:00 (UTC)
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          code=$(curl --silent --show-error --max-time 30 -o /dev/null -w "%{http_code}" \
            'https://nynaypkgnnccjroypvyu.supabase.co/rest/v1/photos?select=id&limit=1' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase answered HTTP $code"
          # 200/401/403 — проект жив (запрос дошёл до базы). Ошибка только если нет ответа или сервер упал.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "Supabase is not responding properly"
            exit 1
          fi
